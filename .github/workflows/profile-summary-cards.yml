name: GitHub Profile Summary Cards

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PROFILE_SUMMARY_CARDS }}
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_SUMMARY_CARDS }}
        with:
          USERNAME: Kevin-Perdomo
          UTC_OFFSET: -3
          AUTO_PUSH: false
      - name: Push to summary branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          cp -r profile-summary-card-output /tmp/profile-summary-card-output
          curl -H "Authorization: token ${{ secrets.PROFILE_SUMMARY_CARDS }}" \
            "https://github-readme-stats.vercel.app/api?username=Kevin-Perdomo&show_icons=true&theme=dark&cache_seconds=1" \
            -o /tmp/github-stats.svg
          curl -H "Authorization: token ${{ secrets.PROFILE_SUMMARY_CARDS }}" \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=Kevin-Perdomo&layout=compact&theme=dark&cache_seconds=1" \
            -o /tmp/top-langs.svg
          git checkout -f summary
          cp -r /tmp/profile-summary-card-output ./profile-summary-card-output
          mkdir -p readme-stats
          cp /tmp/github-stats.svg ./readme-stats/github-stats.svg
          cp /tmp/top-langs.svg ./readme-stats/top-langs.svg
          git add profile-summary-card-output/ readme-stats/
          git diff --cached --quiet || git commit -m "update profile summary cards"
          git push origin summary
